<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<style>
:root{
  --ink:#1d1d1f;
  --soft:#6b6b70;
  --line:#e6e4df;
  --bg:#faf9f7;
  --accent:#0e5c63;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
  font-size:17px;
  line-height:1.65;
}
.wrap{max-width:660px;margin:0 auto;padding:0 22px}
header.site{
  padding:40px 0 28px;
  border-bottom:1px solid var(--line);
}
header.site .name{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:19px;
  font-weight:650;
  letter-spacing:.01em;
  color:var(--ink);
  text-decoration:none;
}
header.site .tag{
  margin:6px 0 0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:14px;
  color:var(--soft);
}
main{padding:36px 0 40px}
a{color:var(--accent)}
h1,h2,h3{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  line-height:1.25;
  letter-spacing:-.01em;
}
h1{font-size:30px;margin:0 0 6px}
h2{font-size:21px;margin:34px 0 10px}
h3{font-size:17px;margin:26px 0 8px}
blockquote{
  margin:20px 0;
  padding:2px 0 2px 18px;
  border-left:3px solid var(--line);
  color:var(--soft);
}
code{font-size:15px;background:#f0eeea;padding:1px 5px;border-radius:4px}
hr{border:none;border-top:1px solid var(--line);margin:32px 0}
footer.site{
  padding:24px 0 48px;
  border-top:1px solid var(--line);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:14px;
  color:var(--soft);
}
footer.site a{color:var(--soft)}
.meta{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:14px;
  color:var(--soft);
}
.postlist{list-style:none;margin:0;padding:0}
.postlist li{padding:18px 0;border-bottom:1px solid var(--line)}
.postlist a.t{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:19px;
  font-weight:600;
  text-decoration:none;
  color:var(--ink);
}
.postlist a.t:hover{color:var(--accent)}
.postlist p{margin:6px 0 0;color:var(--soft);font-size:16px}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="name" href="/">Vidhisha Jain</a>
    <p class="tag">{{ site.description }}</p>
  </div>
</header>
<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>
<footer class="site">
  <div class="wrap">
    <a href="https://www.linkedin.com/in/vidhishajain1805">LinkedIn</a> · <a href="https://github.com/VidhishaJain">GitHub</a>
  </div>
</footer>
</body>
</html>
